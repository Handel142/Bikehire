<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b3ec9">
<title>Bikes</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="theme-early.js"></script>
</head>
<body class="dash">
<div id="topbar"></div>
<main class="wrap">
  <h1 id="hello">Bikes</h1>
  <p class="clock" id="clock"></p>
  <div class="netbar" id="netbar" hidden></div>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div class="alert" id="alert" role="alert" hidden></div>
  <div class="toolbar">
    <input id="find" type="search" placeholder="Search bikes or names" aria-label="Find a bike, name or registration number" autocomplete="off">
    <button class="btn" id="addBikes" type="button">Add bikes</button>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Show bikes"></div>
  <div class="grid" id="grid"></div>
  <section id="requests" hidden></section>
  <section id="history" hidden></section>
</main>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
